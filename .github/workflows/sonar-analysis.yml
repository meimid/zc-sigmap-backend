name: Sonar Analysis staging

on:
  push:
    branches: [ staging ]
    tags: ["[0-9]+.[0-9]+.[0-9]+-D"]
  workflow_dispatch:

jobs:
  sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history helps PR/branch analysis)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # OPTIONAL: if your build needs private Nexus to resolve deps
      # - name: Create settings.xml (Nexus)
      #   uses: s4u/maven-settings-action@v3.0.0
      #   with:
      #     servers: >-
      #       [{"id":"releases","username":"admin","password":"${{ secrets.NEXUS_PASSWORD }}"},
      #        {"id":"snapshots","username":"admin","password":"${{ secrets.NEXUS_PASSWORD }}"}]

      - name: Build & Test (compile all modules)
        run: mvn -B -ntp clean verify -DskipTests

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          mvn -B -ntp org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url="${{ vars.SONAR_HOST_URL }}" \
            -Dsonar.login="${SONAR_TOKEN}" \
            -Dsonar.projectKey="sigmap-${BRANCH}" \
            -Dsonar.projectName="sigmap-${BRANCH}"  