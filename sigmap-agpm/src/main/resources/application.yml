server:
  port: ${PORT:8082}

spring:
  application:
    name: Sigmap AGPM
  datasource:
    url: ${DB_URL:jdbc:mariadb://192.168.2.191:3306/sigmap-db}
    username: ${DB_USERNAME:sigmap}
    password: ${DB_PASSWORD:cl@tIneDr7sT@_heb$22}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: "UTC"
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:/db/db.changelog-master.yml

  security:
    oauth2:
      resourceserver:
        jwt:
          principal-claim-name: preferred_username
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/sigmap-realm}

springdoc:
  default-support-form-data: true
  default-flat-param-object: true
  show-actuator: true
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs-ui.html
    operationsSorter: method
    layout: StandaloneLayout
    displayRequestDuration: true

cors:
  origins: ${CORS_ALLOWED_ORIGINS:http://sigmap-bo.zedneycreative.com,http://localhost:5000}

keycloak:
  client-id: ${KYCLOAK_CLIENT_ID:sigmap-paa}