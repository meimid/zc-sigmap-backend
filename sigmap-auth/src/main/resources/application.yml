server:
  port: ${PORT:8086}
  
  servlet:
    context-path: /auth

management: 
  endpoints:
    health:
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

spring:
  application:
    name: Sigmap AUTH
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/sigmap-db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: "UTC"
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:/db/db.changelog-master.yml

  security:
    oauth2:
      resourceserver:
        jwt:
          principal-claim-name: preferred_username
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://sigmap-auth.zedneycreative.com/realms/sigmap-realm}

  #smtp mail configuration:
  mail:
    test-connection: true
    host: smtp.gmail.com
    port: 587
    username: sigatest18@gmail.com
    password: rgnoxlzlyaygxqri
    properties:
      auth: true
      mail:
        debug: false
        transport:
          protocol: smtp
        smtp:
          starttls:
            enable: true
    default-encoding: utf-8
    base-url: ${BASE_URL_MAIL:http://localhost:4200/}
    from: ${FROM_MAIL:sigatest18@gmail.com}

springdoc:
  default-support-form-data: true
  default-flat-param-object: true
  show-actuator: true
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs-ui.html
    operationsSorter: method
    layout: StandaloneLayout
    displayRequestDuration: true

cors:
  origins: ${CORS_ALLOWED_ORIGINS:http://sigmap-bo.zedneycreative.com,http://localhost:5000,http://localhost:4200}

keycloak:
  client-id: ${KEYCLOAK_CLIENT_ID:sigmap-api}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:null}

keycloak-admin:
  server-url: ${KEYCLOAK_ADMIN_SERVER_URL:https://sigmap-auth.zedneycreative.com}
  realm: ${KEYCLOAK_ADMIN_REALM:sigmap-realm}
  client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:sigmap-admin-api}
  client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:xg4WSMLxHH8BfPZlYKYKtdiwiZI5xHzb}

alfresco:
  url: ${ALFRESCO_URL:http://sigmap-alfresco.zedneycreative.com/alfresco}
  username: ${ALFRESCO_USERNAME:admin}
  password: ${ALFRESCO_PASSWORD:admin}
