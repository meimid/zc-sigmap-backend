server:
  port: ${PORT:8081}
  servlet:
    context-path: /paa


spring:
  application:
    name: Sigmap PAA
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/sigmap-db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE_DEFAULT:1GB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE_DEFAULT:2GB}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: "UTC"
    hibernate:
      ddl-auto: validate

  liquibase:
    change-log: classpath:/db/db.changelog-master.yml

  security:
    oauth2:
      resourceserver:
        jwt:
          principal-claim-name: preferred_username
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://sigmap-auth.zedneycreative.com/realms/sigmap-realm}

springdoc:
  default-support-form-data: true
  default-flat-param-object: true
  show-actuator: true
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs-ui.html
    operationsSorter: method
    layout: StandaloneLayout
    displayRequestDuration: true

cors:
  origins: ${CORS_ALLOWED_ORIGINS:http://sigmap-bo.zedneycreative.com,http://localhost:5000}

keycloak:
  client-id: ${KEYCLOAK_CLIENT_ID:sigmap-api}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:null}

# Flowable: use a dedicated database
flowable:
  process-definition-key: paaProcess
  task-definition-key: saisieTask
  use-default-data-source: false
  database-schema-update: true
  check-process-definitions: true
  process-definition-location-prefix: classpath:/processes/
  datasource:
    url: ${FLOWABLE_DB_URL:jdbc:mariadb://localhost:3307/flowable_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${FLOWABLE_DB_USERNAME:root}
    password: ${FLOWABLE_DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver
tenant:
  id: ${TENANT_ID:paa}
process:
  definition:
    location: ${PROCESS_DEFINITION_LOCATION:processes/}

alfresco:
  url: ${ALFRESCO_URL:http://sigmap-alfresco.zedneycreative.com/alfresco}
  username: ${ALFRESCO_USERNAME:admin}
  password: ${ALFRESCO_PASSWORD:admin}

max-file-size: ${UPLOAD_MAX_FILE_SIZE:31457280}
max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:31457280}