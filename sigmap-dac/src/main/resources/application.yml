server:
  port: ${PORT:8085}
  
  servlet:
    context-path: /dac

spring:
  application:
    name: Sigmap DAC

  devtools:
    restart:
      additional-paths: ../sigmap-common

  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3307/sigmap-db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: "UTC"
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE_DEFAULT:1GB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE_DEFAULT:2GB}

  liquibase:
    change-log: classpath:/db/db.changelog-master.yml

  #smtp mail configuration:
  mail:
    test-connection: false
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:sigatest18@gmail.com}
    password: ${SMTP_PASSWORD:rgnoxlzlyaygxqri}
    properties:
      auth: true
      mail:
        debug: false
        transport:
          protocol: smtp
        smtp:
          starttls:
            enable: true
    default-encoding: utf-8
    base-url: ${SMTP_BASE_URL_MAIL:http://localhost:4200/}
    from: ${SMTP_FROM_MAIL:sigatest18@gmail.com}

  security:
    oauth2:
      resourceserver:
        jwt:
          principal-claim-name: preferred_username
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://sigmap-auth.zedneycreative.com/realms/sigmap-realm}

springdoc:
  default-support-form-data: true
  default-flat-param-object: true
  show-actuator: true
  api-docs:
    path: /api/docs
  swagger-ui:
    path: /api/docs-ui.html
    operationsSorter: method
    layout: StandaloneLayout
    displayRequestDuration: true

cors:
  origins: ${CORS_ALLOWED_ORIGINS:http://sigmap-bo.zedneycreative.com,http://localhost:4200}

keycloak:
  client-id: ${KEYCLOAK_CLIENT_ID:sigmap-api}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:null}

keycloak-admin:
  server-url: ${KEYCLOAK_ADMIN_SERVER_URL:https://sigmap-auth.zedneycreative.com}
  realm: ${KEYCLOAK_ADMIN_REALM:sigmap-realm}
  client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:sigmap-admin-api}
  common-backend-client-id: ${KEYCLOAK_COMMON_BACKEND_CLIENT_ID:backend-common}
  client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:xg4WSMLxHH8BfPZlYKYKtdiwiZI5xHzb}

# Flowable: use a dedicated database
flowable:
  use-default-data-source: false
  database-schema-update: true
  check-process-definitions: true
  process-definition-location-prefix: classpath:/processes/
  datasource:
    url: ${FLOWABLE_DB_URL:jdbc:mariadb://localhost:3307/flowable_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
    username: ${FLOWABLE_DB_USERNAME:root}
    password: ${FLOWABLE_DB_PASSWORD:root}
    driver-class-name: org.mariadb.jdbc.Driver

tenant:
  id: ${TENANT_ID:DAC}
process:
  definition:
    location: ${PROCESS_DEFINITION_LOCATION:processes/}


alfresco:
  url: ${ALFRESCO_URL:http://sigmap-alfresco.zedneycreative.com/alfresco}
  username: ${ALFRESCO_USERNAME:admin}
  password: ${ALFRESCO_PASSWORD:admin}

templateDac:
  dac:
    inputDocPath: ${INPUT_DAC_PATH:C:\\word\\templates\\}
    outputDocPath: ${OUTPUT_DAC_PATH:C:\\word\\temp\\}

documents:
  convertUrl: ${CONVERT_DOCUMENT_URL:http://localhost:3000}

file:
  upload:
    parent-path: ${FILE_UPLOAD_PARENT:C:\\uploads}
    user-profile-path: ${FILE_UPLOAD_USER_PROFILE:${file.upload.parent-path}\\users}
    ac-logo-path: ${FILE_UPLOAD_AC_LOGO:${file.upload.parent-path}\\acs}

# Application-level file size limits (for business validation)
max-file-size: ${UPLOAD_MAX_FILE_SIZE:30MB}

