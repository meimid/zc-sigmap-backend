<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" lang="fr">
<head>
    <meta charset="utf-8"/>
    <title>SIGMAP – Décision de la commission</title>
</head>

<body style="margin:0; padding:0; font-family: Arial, Helvetica, sans-serif;
             font-size:15px; color:#2F3044; line-height:1.5; background-color:#D5D9E2;">

<!-- CONTAINER PRINCIPAL -->
<table align="center" cellpadding="0" cellspacing="0"
       style="max-width:800px; width:100%; background-color:#ffffff;
              margin:40px auto; padding:45px 0 34px 0;">

    <tr>
        <td style="padding:0 15px;">

            <!-- CONTENU -->
            <table width="100%" cellpadding="0" cellspacing="0">

                <!-- MESSAGE INTRO -->
                <tr>
                    <td style="padding-bottom:10px;">
                        <p style="margin:0 0 6px 0;">
                            Bonjour,
                        </p>

                        <p style="margin:0 0 6px 0;">
                            Le dossier
                            <strong th:text="${dossierName}">Nom dossier</strong>
                            transféré à la commission
                            <strong th:text="${commissionName}">Commission</strong>
                            a été traité lors de la réunion du
                            <strong th:text="${reunionDate}">Date</strong>.
                        </p>
                    </td>
                </tr>

                <!-- DÉCISION -->
                <tr>
                    <td style="padding-bottom:10px;">
                        <p style="color:#5E6278; font-size:13px; font-weight:500; margin:0 0 3px 0;">
                            Décision de la commission :
                        </p>

                        <p style="margin:0 0 3px 0;">
                            <strong th:text="${decision}">Décision</strong>
                        </p>

                        <!-- Motif (affiché seulement si présent) -->
                        <p th:if="${motif != null and !#strings.isEmpty(motif)}"
                           style="margin:0 0 3px 0;">
                            <span style="color:#5E6278; font-size:13px; font-weight:500;">Motif :</span>
                            <br/>
                            <span th:text="${motif}"></span>
                        </p>
                    </td>
                </tr>

                <!-- CONTACT -->
                <tr>
                    <td align="center"
                        style="font-size:13px; padding:10px 10px; color:#A1A5B7;">
                        <p style="color:#181C32; font-size:16px; font-weight:600; margin-bottom:9px;">
                            Problèmes ?
                        </p>
                        <p style="margin-bottom:4px;">
                            Contactez
                            <a th:href="'mailto:' + ${from}"
                               style="font-weight:600;"
                               th:text="${from}">email</a>.
                        </p>
                    </td>
                </tr>

                <!-- FOOTER -->
                <tr>
                    <td align="center"
                        style="font-size:13px; padding:0 15px; color:#A1A5B7;">
                        <p>Envoyé depuis SIGMAP.</p>
                    </td>
                </tr>

                <tr>
                    <td align="center"
                        style="font-size:13px; padding:0 15px; color:#A1A5B7;">
                        <p>&copy; SIGMAP team.</p>
                    </td>
                </tr>

                <!-- LOGO -->
                <tr>
                    <td align="center" style="padding:20px 15px;">
                        <img th:src="${logo}" alt="Logo SIGMAP"
                             style="height:75px; display:block; margin:0 auto;"/>
                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
